<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --or:#E85D04;--or2:#FF6B1A;--dark:#111;--surf:#1A1A1A;--surf2:#242424;
  --bd:rgba(255,255,255,0.08);--bd2:rgba(255,255,255,0.16);
  --tx:#F0F0F0;--muted:#888;--green:#22C55E;--yellow:#EAB308;--red:#EF4444;
}
html,body{height:100%;background:var(--dark);font-family:'Barlow',sans-serif;color:var(--tx);}
.app{max-width:680px;margin:0 auto;min-height:100vh;background:var(--dark);border-left:1px solid var(--bd2);border-right:1px solid var(--bd2);}

/* HEADER */
.hdr{background:var(--surf);border-bottom:1px solid var(--bd2);padding:10px 16px;display:flex;align-items:center;gap:0;position:sticky;top:0;z-index:10;}
.logo-wrap{display:flex;align-items:center;gap:10px;flex-shrink:0;}
.logo-img{width:48px;height:48px;border-radius:10px;object-fit:contain;background:#000;padding:2px;}
.brand{display:flex;flex-direction:column;line-height:1.1;}
.brand-top{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--muted);}
.brand-main{font-size:19px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--tx);}
.brand-main span{color:var(--or);}
.tabs{margin-left:auto;display:flex;gap:3px;background:var(--surf2);border-radius:8px;padding:3px;}
.tab{padding:6px 13px;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;color:var(--muted);border:none;background:transparent;letter-spacing:.4px;text-transform:uppercase;font-family:'Barlow',sans-serif;transition:all .15s;}
.tab.on{background:var(--or);color:#fff;}

/* PANELS */
.panel{display:none;}.panel.on{display:block;}

/* STATS */
.activos-hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;}
.activos-title{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);}
.btn-historial{background:transparent;border:1px solid var(--bd2);border-radius:7px;padding:5px 11px;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;font-family:'Barlow',sans-serif;display:flex;align-items:center;gap:5px;transition:all .15s;}
.btn-historial.on{border-color:var(--or);color:var(--or);}
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 16px 12px;}
.sc{background:var(--surf);border-radius:10px;padding:10px 12px;border:1px solid var(--bd);}
.sc-v{font-size:20px;font-weight:800;}
.sc-l{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:2px;}

/* ORDER CARDS */
.empty-state{text-align:center;padding:56px 20px;color:var(--muted);}
.empty-state i{font-size:44px;display:block;margin-bottom:12px;opacity:.25;}
.empty-state p{font-size:14px;}
.order-list{padding:0 12px 20px;}
.ocard{background:var(--surf);border:1px solid var(--bd);border-radius:12px;margin-bottom:9px;overflow:hidden;transition:border-color .2s;}
.ocard.retrasado{border-left:3px solid var(--red);}
.ocard.preparando{border-left:3px solid var(--yellow);}
.ocard.entregado{border-left:3px solid var(--green);opacity:.6;}
.oc-top{display:grid;grid-template-columns:1fr 1fr 1fr;align-items:center;gap:6px;padding:10px 14px 8px;}
.oc-top-left{display:flex;flex-direction:column;gap:5px;align-items:flex-start;}
.oc-top-badges{display:flex;gap:5px;flex-wrap:wrap;}
.oc-num{font-size:14px;font-weight:800;color:var(--or);}
.badge{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:20px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;}
.b-prep{background:rgba(234,179,8,.15);color:var(--yellow);}
.b-ret{background:rgba(239,68,68,.15);color:var(--red);}
.b-ent{background:rgba(34,197,94,.15);color:var(--green);}
.b-del{background:rgba(232,93,4,.12);color:var(--or);}
.b-pic{background:rgba(255,255,255,.06);color:var(--muted);}
.b-fin{background:rgba(99,102,241,.15);color:#818cf8;}

/* TURNO */
.turno-bar{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;background:var(--surf2);border-bottom:1px solid var(--bd);}
.turno-info{font-size:11px;color:var(--muted);}
.turno-info strong{color:var(--tx);font-size:12px;}
.btn-turno-abrir{background:var(--green);color:#fff;border:none;border-radius:7px;padding:6px 14px;font-size:12px;font-weight:700;cursor:pointer;font-family:'Barlow',sans-serif;display:flex;align-items:center;gap:5px;}
.btn-turno-cerrar{background:rgba(239,68,68,.15);color:var(--red);border:1px solid var(--red);border-radius:7px;padding:6px 14px;font-size:12px;font-weight:700;cursor:pointer;font-family:'Barlow',sans-serif;display:flex;align-items:center;gap:5px;}
.turno-cerrado-msg{text-align:center;padding:32px 20px;color:var(--muted);}
.turno-cerrado-msg i{font-size:36px;display:block;margin-bottom:10px;opacity:.3;}
@keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
.turno-cerrado-msg p{font-size:14px;margin-bottom:14px;}
.btn-turno-abrir-big{background:var(--green);color:#fff;border:none;border-radius:10px;padding:12px 28px;font-size:14px;font-weight:700;cursor:pointer;font-family:'Barlow',sans-serif;}

/* COMBO SABOR */
.combo-btn{background:transparent;border:1px dashed var(--bd2);border-radius:6px;padding:3px 8px;font-size:11px;color:var(--muted);cursor:pointer;font-family:'Barlow',sans-serif;white-space:nowrap;transition:all .15s;margin-top:3px;}
.combo-btn:hover{border-color:var(--or);color:var(--or);}
.combo-btn.active{border-color:var(--or);color:var(--or);background:rgba(232,93,4,.08);}
.combo-wrap{display:flex;flex-direction:column;gap:3px;}
.combo-second{display:none;}
.combo-second.show{display:block;}
.combo-price-note{font-size:10px;color:var(--or);text-align:center;margin-top:2px;}
.badge-pago-pend{background:rgba(234,179,8,.12);color:var(--yellow);border:1px solid rgba(234,179,8,.3);}
.badge-pago-pag{background:rgba(34,197,94,.12);color:var(--green);border:1px solid rgba(34,197,94,.3);}
.btn-pago{width:30px;height:30px;border-radius:7px;border:2px solid;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;transition:all .2s;flex-shrink:0;}
.btn-pago.pend{background:rgba(239,68,68,.12);border-color:var(--red);color:var(--red);}
.btn-pago.pag{background:rgba(34,197,94,.15);border-color:var(--green);color:var(--green);}
.pago-toggle-row{display:flex;gap:6px;margin-top:4px;}
.pago-tgl{flex:1;padding:6px;background:var(--surf2);border:1px solid var(--bd2);border-radius:7px;font-size:11px;font-weight:700;cursor:pointer;color:var(--muted);text-align:center;transition:all .15s;font-family:'Barlow',sans-serif;text-transform:uppercase;letter-spacing:.3px;}
.pago-tgl.on-pend{background:rgba(234,179,8,.12);border-color:var(--yellow);color:var(--yellow);}
.pago-tgl.on-pag{background:rgba(34,197,94,.12);border-color:var(--green);color:var(--green);}
.oc-tel{font-size:15px;font-weight:700;color:var(--tx);display:flex;align-items:center;justify-content:flex-end;gap:6px;background:var(--surf2);border:1px solid var(--bd2);border-radius:8px;padding:5px 12px;font-family:"JetBrains Mono","Courier New",monospace;letter-spacing:1.5px;}
.oc-items{font-size:12px;color:var(--muted);padding:0 14px 8px;line-height:1.6;}
.oc-bot{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;border-top:1px solid var(--bd);}
.oc-total{font-size:15px;font-weight:800;}
.oc-right{display:flex;align-items:center;gap:8px;}
.oc-time{font-size:10px;color:var(--muted);}
.stt-sel{background:var(--surf2);border:1px solid var(--bd2);border-radius:6px;padding:4px 7px;font-size:11px;color:var(--tx);font-family:'Barlow',sans-serif;cursor:pointer;font-weight:700;}
.card-edit-row{display:flex;align-items:center;gap:6px;padding:6px 14px;border-top:1px solid var(--bd);background:rgba(255,255,255,.02);}
.card-edit-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);white-space:nowrap;}
.card-edit-input{background:var(--surf2);border:1px solid var(--bd2);border-radius:6px;padding:4px 8px;font-size:13px;color:var(--tx);font-family:'JetBrains Mono','Courier New',monospace;width:80px;outline:none;}
.card-edit-input:focus{border-color:var(--or);}
.card-pago-btn{padding:4px 10px;border-radius:6px;font-size:11px;font-weight:700;cursor:pointer;font-family:'Barlow',sans-serif;border:1px solid var(--bd2);background:transparent;color:var(--muted);transition:all .15s;}
.card-pago-btn.on{background:rgba(34,197,94,.12);border-color:var(--green);color:var(--green);}
.btn-detail{background:rgba(34,197,94,.12);border:1px solid var(--green);border-radius:6px;padding:4px 8px;color:var(--green);font-size:11px;cursor:pointer;font-family:'Barlow',sans-serif;transition:all .15s;}
.btn-detail:hover{background:rgba(34,197,94,.25);color:var(--green);}

/* DETAIL PANEL */
.det-panel{background:var(--surf);border:1px solid var(--bd2);border-radius:12px;margin:0 12px 12px;padding:16px;}
.det-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.det-title{font-size:15px;font-weight:800;}
.btn-close-det{background:none;border:1px solid var(--bd2);border-radius:6px;padding:4px 10px;color:var(--muted);font-size:12px;cursor:pointer;font-family:'Barlow',sans-serif;}
.det-row{display:flex;justify-content:space-between;padding:5px 0;font-size:13px;border-bottom:1px solid var(--bd);}
.det-row:last-child{border:none;}
.det-row span:first-child{color:var(--muted);}
.det-sec{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);margin:10px 0 4px;}

/* TOAST */
.toast{background:var(--green);color:#fff;padding:9px 14px;border-radius:8px;font-size:13px;font-weight:700;display:none;align-items:center;gap:6px;margin:0 16px 12px;}

/* NUEVO PEDIDO */
.pnl-nuevo{padding:16px;}
.sheets-box{background:var(--surf2);border:1px dashed var(--bd2);border-radius:10px;padding:12px 14px;margin-bottom:14px;}
.sheets-row{display:flex;gap:8px;margin-top:6px;}
.btn-load{background:var(--surf);border:1px solid var(--bd2);border-radius:7px;padding:7px 12px;color:var(--tx);font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;font-family:'Barlow',sans-serif;transition:border-color .15s;}
.btn-load:hover{border-color:var(--or);color:var(--or);}
.fg{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;}
.fg label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);}
input,select{background:var(--surf2);border:1px solid var(--bd2);border-radius:8px;padding:8px 11px;font-size:13px;color:var(--tx);font-family:'Barlow',sans-serif;outline:none;transition:border-color .15s;width:100%;}
input:focus,select:focus{border-color:var(--or);}
select option{background:var(--surf2);}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.toggle-row{display:flex;gap:6px;}
.tgl{flex:1;padding:8px 6px;background:var(--surf2);border:1px solid var(--bd2);border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;color:var(--muted);text-align:center;transition:all .15s;font-family:'Barlow',sans-serif;text-transform:uppercase;letter-spacing:.3px;}
.tgl.on{background:rgba(232,93,4,.15);border-color:var(--or);color:var(--or);}
.tgl-pago.on{background:rgba(34,197,94,.12);border-color:var(--green);color:var(--green);}
.prod-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.sec-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);}
.btn-add{background:var(--or);color:#fff;border:none;border-radius:7px;padding:5px 11px;font-size:12px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:4px;font-family:'Barlow',sans-serif;}
.btn-add:hover{background:var(--or2);}
.prod-hdr-row{display:grid;grid-template-columns:1fr 52px 82px 30px;gap:7px;margin-bottom:3px;}
.prod-hdr-row span{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);text-align:center;}
.prod-hdr-row span:first-child{text-align:left;}
.prod-row{display:grid;grid-template-columns:1fr 52px 82px 30px;gap:7px;align-items:center;margin-bottom:7px;}
.prod-row select,.prod-row input{font-size:12px;}
.prod-row input{text-align:center;}
.btn-rm{background:none;border:1px solid var(--bd2);border-radius:6px;width:30px;height:34px;cursor:pointer;color:var(--muted);font-size:14px;display:flex;align-items:center;justify-content:center;transition:all .15s;}
.btn-rm:hover{border-color:var(--red);color:var(--red);}
.totals{background:var(--surf2);border-radius:10px;padding:12px 14px;margin-top:12px;border:1px solid var(--bd);}
.tot-row{display:flex;justify-content:space-between;font-size:13px;padding:3px 0;}
.tot-row span:first-child{color:var(--muted);}
.tot-big{font-size:16px;font-weight:800;border-top:1px solid var(--bd2);margin-top:8px;padding-top:9px;}
.tot-big span:last-child{color:var(--or);}
.btn-reg{width:100%;background:var(--or);color:#fff;border:none;border-radius:10px;padding:13px;font-size:14px;font-weight:800;cursor:pointer;margin-top:14px;text-transform:uppercase;letter-spacing:.5px;display:flex;align-items:center;justify-content:center;gap:7px;font-family:'Barlow',sans-serif;transition:background .15s;}
.btn-reg:hover{background:var(--or2);}
.btn-reg:active{transform:scale(.99);}
.hr{height:1px;background:var(--bd);margin:14px 0;}

/* CRONOMETRO */
.timer-center{display:flex;flex-direction:column;align-items:center;justify-content:center;}
.timer-center .timer-val{font-family:"JetBrains Mono","Courier New",monospace;font-size:26px;font-weight:700;letter-spacing:2px;line-height:1;}
.timer-center .timer-lbl{font-size:9px;text-transform:uppercase;letter-spacing:1px;margin-top:3px;opacity:.5;}
.timer-prep{color:var(--yellow);}
.timer-ret{color:var(--red);}
/* legacy small timer — ya no se usa en bot */
.timer{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:64px;}
.timer-val{font-family:"JetBrains Mono","Courier New",monospace;font-size:17px;font-weight:700;letter-spacing:1px;line-height:1;}
.timer-lbl{font-size:9px;text-transform:uppercase;letter-spacing:.6px;margin-top:2px;opacity:.6;}

/* AUTOCOMPLETE */
.ac-wrap{position:relative;width:100%;}
.ac-input{background:var(--surf2);border:1px solid var(--bd2);border-radius:8px;padding:8px 11px;font-size:12px;color:var(--tx);font-family:'Barlow',sans-serif;outline:none;transition:border-color .15s;width:100%;}
.ac-input:focus{border-color:var(--or);}
.ac-dropdown{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--surf);border:1px solid var(--bd2);border-radius:8px;z-index:100;max-height:200px;overflow-y:auto;display:none;box-shadow:0 8px 24px rgba(0,0,0,.4);}
.ac-item{padding:9px 12px;font-size:13px;cursor:pointer;border-bottom:1px solid var(--bd);transition:background .1s;}
.ac-item:last-child{border:none;}
.ac-item:hover,.ac-item.active{background:rgba(232,93,4,.15);color:var(--or);}
.ac-item strong{color:var(--or);}

@media(max-width:480px){
  .brand-main{font-size:16px;}
  .row2{grid-template-columns:1fr;}
  .prod-row{grid-template-columns:1fr 44px 70px 28px;}
}
</style>
</head>

        <div class="fg" style="margin:0;" id="field-delivery">

          <input type="number" id="inp-delivery" value="0" min="0" step="0.5" oninput="calcTots()"/>
        </div>
        <div class="fg" style="margin:0;">
          <label>Notas / referencia</label>
          <input type="text" id="inp-notas" placeholder="Opcional..."/>
        </div>
      </div>

      <button class="btn-reg" onclick="regOrder()">
        <i class="ti ti-check" aria-hidden="true"></i> Registrar pedido
      </button>
    </div>
  </div>
</div>

<script>
var orders = JSON.parse(localStorage.getItem('lv_orders') || '[]');
var counter = parseInt(localStorage.getItem('lv_ctr') || '1');
var catalog = [
  {name:'Pizza Personal Margarita',price:18},
  {name:'Pizza Personal Especial',price:22},
  {name:'Pizza Mediana 4 Ingredientes',price:35},
  {name:'Pizza Grande 4 Ingredientes',price:45},
  {name:'Pizza Familiar 4 Ingredientes',price:55},
  {name:'Lasagna porcion',price:18},
  {name:'Alitas BBQ (8 pzs)',price:22},
  {name:'Gaseosa personal',price:5},
  {name:'Gaseosa litro',price:8}
];
var tipo = 'delivery', pago = 'Efectivo', estadoPago = 'Pendiente', showAll = false, detailId = null;
var turnoActivo = null;
var turnosHist  = [];
var appLoading  = true;

// ── TURNOS ──
function saveTurno() {
  // Turno persiste en Sheets — localStorage solo como cache
  localStorage.setItem('lv_turno', JSON.stringify(turnoActivo));
}

function toggleTurno() {
  if (!turnoActivo) {
    var nuevoTurno = { id: Date.now(), inicio: new Date().toISOString(), pedidos: [] };
    fetch(API_URL, {
      method: 'POST', mode: 'no-cors',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({action: 'abrirTurno', turnoId: nuevoTurno.id, inicio: nuevoTurno.inicio})
    }).catch(function(e){ console.warn('abrirTurno error:', e); });
    turnoActivo = nuevoTurno;
    orders = [];
    saveTurno();
    renderTurnoBar();
    renderList();
  } else {
    if (!confirm('¿Cerrar el turno actual? Los pedidos activos quedarán en el historial.')) return;
    var fin = new Date().toISOString();
    var tOrds = orders.filter(function(o){ return turnoActivo.pedidos.indexOf(o.id) !== -1; });
    var recaudado = tOrds.filter(function(o){ return o.estadoPago === 'Pagado'; })
      .reduce(function(a,o){ return a+o.total; }, 0);
    fetch(API_URL, {
      method: 'POST', mode: 'no-cors',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({action: 'cerrarTurno', turnoId: turnoActivo.id,
        fin: fin, totalPedidos: tOrds.length, recaudado: recaudado})
    }).catch(function(e){ console.warn('cerrarTurno error:', e); });
    turnoActivo = null;
    orders = [];
    saveTurno();
    renderTurnoBar();
    renderList();
  }
}

function renderTurnoBar() {
  var bar  = document.getElementById('turno-bar');
  var info = document.getElementById('turno-info');
  var btn  = document.getElementById('btn-turno');
  if (!bar) return;
  if (turnoActivo) {
    var d = new Date(turnoActivo.inicio);
    var hora = d.toLocaleTimeString('es-PE',{hour:'2-digit',minute:'2-digit'});
    var fecha = d.toLocaleDateString('es-PE',{day:'2-digit',month:'short'});
    info.innerHTML = '<strong>Turno abierto</strong> desde ' + fecha + ' ' + hora;
    btn.className = 'btn-turno-cerrar';
    btn.innerHTML = '<i class="ti ti-player-stop" aria-hidden="true"></i> Cerrar turno';
    bar.style.borderBottomColor = 'rgba(34,197,94,.3)';
  } else {
    info.innerHTML = 'Sin turno activo';
    btn.className = 'btn-turno-abrir';
    btn.innerHTML = '<i class="ti ti-player-play" aria-hidden="true"></i> Abrir turno';
    bar.style.borderBottomColor = '';
  }
}

function turnoOrders() {
  if (!turnoActivo) return [];
  return orders.filter(function(o){ return turnoActivo.pedidos.indexOf(o.id) !== -1; });
}

function save() {
  localStorage.setItem('lv_orders', JSON.stringify(orders));
  localStorage.setItem('lv_ctr', counter);
}
function pad(n) { return String(n).padStart(3, '0'); }

function goTab(tab, btn) {
  document.querySelectorAll('.tab').forEach(function(b) { b.classList.remove('on'); });
  document.querySelectorAll('.panel').forEach(function(p) { p.classList.remove('on'); });
  btn.classList.add('on');
  document.getElementById('panel-' + tab).classList.add('on');
  if (tab === 'activos') { detailId = null; renderList(); }
}

function toggleHistorial() {
  showAll = !showAll;
  var btn = document.getElementById('btn-hist');
  var lbl = document.getElementById('lista-label');
  if (showAll) {
    btn.classList.add('on');
    btn.innerHTML = '<i class="ti ti-list" aria-hidden="true"></i> Solo activos';
    lbl.textContent = 'Todos los pedidos';
  } else {
    btn.classList.remove('on');
    btn.innerHTML = '<i class="ti ti-history" aria-hidden="true"></i> Ver historial';
    lbl.textContent = 'Pedidos activos';
  }
  detailId = null;
  renderList();
}

function formatTel(t) {
  // Limpiar todo lo que no sea numero
  var d = (t || '').replace(/[^0-9]/g, '');
  // Formato ### ### ###
  if (d.length === 9) return d.slice(0,3) + ' ' + d.slice(3,6) + ' ' + d.slice(6,9);
  if (d.length === 8) return d.slice(0,4) + ' ' + d.slice(4,8);
  return t; // si no coincide, devolver tal cual
}

function renderStats() {
  var tOrds = turnoActivo
    ? orders.filter(function(o){ return turnoActivo.pedidos.indexOf(o.id) !== -1; })
    : [];
  var activos   = tOrds.filter(function(o){ return o.estado !== 'finalizado'; }).length;
  var ret       = tOrds.filter(function(o){ return o.estado === 'retrasado'; }).length;
  var recaudado = tOrds.filter(function(o){ return o.estadoPago === 'Pagado'; })
    .reduce(function(a,o){ return a+o.total; }, 0);
  document.getElementById('stats-row').innerHTML =
    sc(activos, 'Activos', 'ti-flame') +
    sc(ret, 'Retrasados', 'ti-alert-triangle') +
    sc('S/ ' + recaudado.toFixed(2), 'Recaudado', 'ti-coin');
}
function sc(v, l, ic) {
  return '<div class="sc"><div class="sc-v">' + v + '</div><div class="sc-l"><i class="ti ' + ic + '" aria-hidden="true"></i> ' + l + '</div></div>';
}

function buildEditRow(o) {
  var pagoEf = o.pago === 'Efectivo' ? ' on' : '';
  var pagoYp = o.pago === 'Yape/Plin' ? ' on' : '';
  return '<div class="card-edit-row" onclick="event.stopPropagation()">'
    + '<span class="card-edit-label">Delivery</span>'
    + '<input class="card-edit-input" type="number" min="0" step="0.5" value="' + o.delivery.toFixed(2) + '"'
    + ' onclick="event.stopPropagation()"'
    + ' onchange="event.stopPropagation();updateDelivery(' + o.id + ',this.value)" style="width:70px;"/>'
    + '<span class="card-edit-label" style="margin-left:8px;">Pago</span>'
    + '<button class="card-pago-btn' + pagoEf + '" id="cpago-ef-' + o.id + '"'
    + ' onclick="event.stopPropagation();setCardPago(' + o.id + ',0)">'
    + '<i class="ti ti-cash" aria-hidden="true"></i> Efectivo</button>'
    + '<button class="card-pago-btn' + pagoYp + '" id="cpago-yp-' + o.id + '"'
    + ' onclick="event.stopPropagation();setCardPago(' + o.id + ',1)">'
    + '<i class="ti ti-device-mobile" aria-hidden="true"></i> Yape/Plin</button>'
    + '</div>';
}

function renderList() {
  renderStats();
  document.getElementById('detail-area').innerHTML = '';
  if (detailId) renderDetail(detailId);
  var turnoOrds = turnoActivo
    ? orders.filter(function(o){ return turnoActivo.pedidos.indexOf(o.id) !== -1; })
    : [];
  var list = showAll
    ? turnoOrds
    : turnoOrds.filter(function(o){ return o.estado !== 'finalizado'; });
  var el = document.getElementById('order-list');
  if (!turnoActivo) {
    el.innerHTML = '<div class="turno-cerrado-msg"><i class="ti ti-moon" aria-hidden="true"></i><p>No hay turno activo</p>' +
      '<button class="btn-turno-abrir-big" onclick="toggleTurno()"><i class="ti ti-player-play" aria-hidden="true"></i> Abrir turno</button></div>';
    return;
  }
  if (!list.length) {
    el.innerHTML = '<div class="empty-state"><i class="ti ti-pizza" aria-hidden="true"></i><p>' +
      (showAll ? 'No hay pedidos en este turno' : 'No hay pedidos activos') + '</p></div>';
    return;
  }
  el.innerHTML = list.map(function(o) {
    var hora = new Date(o.fecha).toLocaleTimeString('es-PE', {hour:'2-digit', minute:'2-digit'});
    var items = o.products.map(function(p) { return p.qty + 'x ' + p.name; }).join(' - ');
    var bc = o.estado === 'preparando' ? 'b-prep' : o.estado === 'retrasado' ? 'b-ret' : o.estado === 'finalizado' ? 'b-fin' : 'b-ent';
    var bl = o.estado === 'preparando' ? 'Preparando' : o.estado === 'retrasado' ? 'Retrasado' : o.estado === 'finalizado' ? 'Finalizado' : 'Entregado';
    return '<div class="ocard ' + o.estado + '">' +
      '<div class="oc-top">' +
      '<div class="oc-top-left">' +
        '<span class="oc-num">#' + pad(o.id) + '</span>' +
        '<div class="oc-top-badges">' +
          '<span class="badge ' + bc + '">' + bl + '</span>' +
          (o.tipo === 'delivery'
            ? '<span class="badge b-del"><i class="ti ti-motorcycle" aria-hidden="true"></i> Delivery</span>'
            : '<span class="badge b-pic"><i class="ti ti-walk" aria-hidden="true"></i> Pickup</span>') +
        '</div>' +
      '</div>' +
      (o.estado !== 'entregado' && o.estado !== 'finalizado'
        ? '<div class="timer-center ' + (o.estado === 'retrasado' ? 'timer-ret' : 'timer-prep') + '" id="timer-' + o.id + '">' +
          '<span class="timer-val">--:--</span><span class="timer-lbl">transcurrido</span></div>'
        : '<div></div>') +
      '<span class="oc-tel"><i class="ti ti-phone" style="font-size:14px;color:var(--or)" aria-hidden="true"></i> ' + formatTel(o.tel) + '</span>' +
      '</div>' +
      '<div class="oc-items">' + items + '</div>' +
      buildEditRow(o) +
      '<div class="oc-bot"><span class="oc-total">S/ ' + o.total.toFixed(2) + '</span>' +
      '<div class="oc-right">' +
      '<span class="oc-time">' + hora + '</span>' +
      '<button class="btn-pago ' + (o.estadoPago === 'Pagado' ? 'pag' : 'pend') + '" ' +
        'onclick="togglePago(' + o.id + ',event)" title="' + (o.estadoPago === 'Pagado' ? 'Pagado — click para revertir' : 'Pendiente — click para marcar pagado') + '">' +
        (o.estadoPago === 'Pagado' ? '<i class=\"ti ti-currency-dollar\" aria-hidden=\"true\"></i>' : '<i class=\"ti ti-currency-dollar\" aria-hidden=\"true\"></i>') +
      '</button>' +
      '<select class="stt-sel" onchange="changeStatus(' + o.id + ',this.value)" onclick="event.stopPropagation()">' +
      '<option value="preparando"' + (o.estado === 'preparando' ? ' selected' : '') + '>Preparando</option>' +
      '<option value="retrasado"' + (o.estado === 'retrasado' ? ' selected' : '') + '>Retrasado</option>' +
      '<option value="entregado"' + (o.estado === 'entregado' ? ' selected' : '') + '>Entregado</option>' +
      '<option value="finalizado"' + (o.estado === 'finalizado' ? ' selected' : '') +
        (o.estadoPago !== 'Pagado' ? ' disabled' : '') + '>Finalizado</option>' +
      '</select>' +
      '<button class="btn-detail" onclick="toggleDetail(' + o.id + ',event)"><i class="ti ti-info-circle" style="font-size:13px" aria-hidden="true"></i></button>' +
      '</div></div></div>';
  }).join('');
}

function updateDelivery(id, val) {
  var o = orders.find(function(x) { return x.id === id; });
  if (!o) return;
  var newDel = parseFloat(val) || 0;
  o.delivery = newDel;
  o.total = parseFloat((o.subtotal + newDel).toFixed(2));
  save();
  // Actualizar en Sheets
  fetch(API_URL, {
    method: 'POST', mode: 'no-cors',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({action: 'updateDelivery', id: id, delivery: newDel, total: o.total})
  }).catch(function(e){ console.warn('updateDelivery error:', e); });
  renderList();
}

function setCardPago(id, idx) {
  var tipos = ['Efectivo', 'Yape/Plin'];
  var nuevoPago = tipos[idx];
  var o = orders.find(function(x) { return x.id === id; });
  if (!o) return;
  o.pago = nuevoPago;
  save();
  fetch(API_URL, {
    method: 'POST', mode: 'no-cors',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({action: 'updatePago', id: id, pago: nuevoPago})
  }).catch(function(e){ console.warn('setCardPago error:', e); });
  renderList();
}

function togglePago(id, e) {
  e.stopPropagation();
  var o = orders.find(function(x) { return x.id === id; });
  if (!o) return;
  o.estadoPago = o.estadoPago === 'Pagado' ? 'Pendiente' : 'Pagado';
  save();
  updateSheetEstadoPago(id, o.estadoPago);
  renderList();
}

function changeStatus(id, est) {
  var o = orders.find(function(x) { return x.id === id; });
  if (!o) return;
  if (est === 'finalizado' && o.estadoPago !== 'Pagado') {
    alert('No se puede finalizar un pedido con pago pendiente.');
    renderList();
    return;
  }
  o.estado = est;
  save();
  updateSheetStatus(id, est);
  renderList();
}

function toggleDetail(id, e) {
  e.stopPropagation();
  if (detailId === id) { detailId = null; document.getElementById('detail-area').innerHTML = ''; return; }
  detailId = id; renderDetail(id);
}

function renderDetail(id) {
  var o = orders.find(function(x) { return x.id === id; });
  if (!o) { document.getElementById('detail-area').innerHTML = ''; return; }
  var prods = o.products.map(function(p) {
    return '<div class="det-row"><span>' + p.qty + 'x ' + p.name + '</span><span>S/ ' + p.subtotal.toFixed(2) + '</span></div>';
  }).join('');
  document.getElementById('detail-area').innerHTML =
    '<div class="det-panel"><div class="det-hdr">' +
    '<span class="det-title">Pedido #' + pad(o.id) + '</span>' +
    '<button class="btn-close-det" onclick="closeDetail()"><i class="ti ti-x" aria-hidden="true"></i> Cerrar</button></div>' +
    '<div class="det-sec">Cliente</div>' +
    '<div class="det-row"><span>Telefono</span><span>' + o.tel + '</span></div>' +
    '<div class="det-row"><span>Tipo</span><span>' + (o.tipo === 'delivery' ? 'Delivery' : 'Pickup') + '</span></div>' +
    '<div class="det-row"><span>Método pago</span><span>' + o.pago + '</span></div>' + '<div class="det-row"><span>Estado pago</span><span class="badge ' + (o.estadoPago === 'Pagado' ? 'badge-pago-pag' : 'badge-pago-pend') + '">' + (o.estadoPago || 'Pendiente') + '</span></div>' +
    (o.notas ? '<div class="det-row"><span>Notas</span><span>' + o.notas + '</span></div>' : '') +
    '<div class="det-sec">Productos</div>' + prods +
    '<div class="det-sec">Totales</div>' +
    '<div class="det-row"><span>Subtotal</span><span>S/ ' + o.subtotal.toFixed(2) + '</span></div>' +
    (o.tipo === 'delivery' ? '<div class="det-row"><span>Delivery</span><span>S/ ' + o.delivery.toFixed(2) + '</span></div>' : '') +
    '<div class="det-row" style="font-weight:800;font-size:14px;"><span>Total</span><span style="color:var(--or)">S/ ' + o.total.toFixed(2) + '</span></div>' +
    '<div class="det-sec">Registro</div>' +
    '<div class="det-row"><span>Hora</span><span>' + new Date(o.fecha).toLocaleString('es-PE') + '</span></div>' +
    '</div>';
}
function closeDetail() { detailId = null; document.getElementById('detail-area').innerHTML = ''; }

function setTipo(t) {
  tipo = t;
  document.getElementById('t-del').classList.toggle('on', t === 'delivery');
  document.getElementById('t-pic').classList.toggle('on', t === 'pickup');
  document.getElementById('field-delivery').style.display = t === 'delivery' ? 'flex' : 'none';
  document.getElementById('t-del-row').style.display = t === 'delivery' ? 'flex' : 'none';
  if (t === 'pickup') document.getElementById('inp-delivery').value = 0;
  calcTots();
}
function setPago(p) {
  pago = p;
  document.getElementById('p-ef').classList.toggle('on', p === 'Efectivo');
  document.getElementById('p-yp').classList.toggle('on', p === 'Yape/Plin');
}

function setEstadoPago(ep) {
  estadoPago = ep;
  var pendBtn = document.getElementById('ep-pend');
  var pagBtn  = document.getElementById('ep-pag');
  pendBtn.classList.remove('on-pend','on-pag');
  pagBtn.classList.remove('on-pend','on-pag');
  if (ep === 'Pendiente') pendBtn.classList.add('on-pend');
  else pagBtn.classList.add('on-pag');
}
function buildOpts(sel) { return sel; } // legacy compat

function addRow(name, qty, price) {
  var uid  = 'ac'  + Date.now() + Math.floor(Math.random()*1000);
  var uid2 = 'ac2' + Date.now() + Math.floor(Math.random()*1001);
  var d = document.createElement('div');
  d.className = 'prod-row';
  d.setAttribute('data-product', name || '');
  d.innerHTML =
    '<div class="combo-wrap">' +
      '<div class="ac-wrap">' +
        '<input class="ac-input" id="' + uid + '" type="text" placeholder="Buscar producto..." autocomplete="off"' +
          (name ? ' value="' + name + '"' : '') + ' oninput="acFilter(this)" onkeydown="acKey(event,this)" onfocus="acFilter(this)" onblur="acBlur(this)"/>' +
        '<div class="ac-dropdown" id="drop-' + uid + '"></div>' +
      '</div>' +
      '<button class="combo-btn" onclick="toggleCombo(this)" title="Agregar segundo sabor">'+
        '<i class="ti ti-plus" aria-hidden="true"></i> 2do sabor' +
      '</button>' +
      '<div class="combo-second" id="combo-' + uid + '">' +
        '<div class="ac-wrap">' +
          '<input class="ac-input ac-input2" id="' + uid2 + '" type="text" placeholder="Segundo sabor..." autocomplete="off"' +
            ' oninput="acFilter(this);calcComboPrice(this)" onkeydown="acKey(event,this)" onfocus="acFilter(this)" onblur="acBlurCombo(this)"/>' +
          '<div class="ac-dropdown" id="drop-' + uid2 + '"></div>' +
        '</div>' +
        '<div class="combo-price-note" id="note-' + uid + '"></div>' +
      '</div>' +
    '</div>' +
    '<input type="number" min="1" value="' + (qty || 1) + '" oninput="calcTots()" style="text-align:center;">' +
    '<input type="number" min="0" step="0.5" value="' + (price !== undefined ? price : 0) + '" oninput="calcTots()" style="text-align:center;">' +
    '<button class="btn-rm" onclick="this.parentElement.remove();calcTots()"><i class="ti ti-trash" aria-hidden="true"></i></button>';
  document.getElementById('prod-container').appendChild(d);
  if (name) calcTots();
}

function toggleCombo(btn) {
  var wrap = btn.closest('.combo-wrap');
  var second = wrap.querySelector('.combo-second');
  var isOpen = second.classList.contains('show');
  second.classList.toggle('show', !isOpen);
  btn.classList.toggle('active', !isOpen);
  if (isOpen) {
    // Limpiar segundo sabor y recalcular
    var inp2 = wrap.querySelector('.ac-input2');
    if (inp2) inp2.value = '';
    var note = wrap.querySelector('.combo-price-note');
    if (note) note.textContent = '';
    // Restaurar precio desde primer sabor
    var inp1 = wrap.querySelector('.ac-input');
    var match = catalog.find(function(c){ return c.name === inp1.value; });
    var row = btn.closest('.prod-row');
    if (match) row.querySelectorAll('input[type=number]')[1].value = match.price.toFixed(2);
    calcTots();
  }
}

function calcComboPrice(inp2) {
  var wrap = inp2.closest('.combo-wrap');
  var inp1 = wrap.querySelector('.ac-input:not(.ac-input2)');
  var row  = inp2.closest('.prod-row');
  var note = wrap.querySelector('.combo-price-note');
  var m1 = catalog.find(function(c){ return c.name === inp1.value; });
  var m2 = catalog.find(function(c){ return c.name === inp2.value; });
  if (m1 && m2) {
    var combo = Math.ceil((m1.price + m2.price) / 2);
    row.querySelectorAll('input[type=number]')[1].value = combo.toFixed(2);
    note.textContent = 'Precio combinado: S/ ' + combo.toFixed(2);
    calcTots();
  }
}

function acBlurCombo(inp) {
  setTimeout(function() {
    var drop = document.getElementById('drop-' + inp.id);
    if (drop) drop.style.display = 'none';
    calcComboPrice(inp);
  }, 150);
}

function acFilter(inp) {
  var val = inp.value.toLowerCase().trim();
  var drop = document.getElementById('drop-' + inp.id);
  var matches = val === ''
    ? catalog
    : catalog.filter(function(c) { return c.name.toLowerCase().indexOf(val) !== -1; });
  if (!matches.length) { drop.style.display = 'none'; return; }
  drop.innerHTML = matches.map(function(c, i) {
    var hl = c.name.replace(new RegExp('(' + val.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi'), '<strong>$1</strong>');
    return '<div class="ac-item" data-name="' + c.name + '" data-price="' + c.price + '" ' +
      'onmousedown="acSelect(this)">' + hl + ' <span style="float:right;color:var(--muted);font-size:11px;">S/ ' + c.price.toFixed(2) + '</span></div>';
  }).join('');
  drop.style.display = 'block';
}

function acSelect(item) {
  var wrap = item.closest('.ac-wrap');
  var inp  = wrap.querySelector('.ac-input');
  var drop = wrap.querySelector('.ac-dropdown');
  var name  = item.getAttribute('data-name');
  var price = parseFloat(item.getAttribute('data-price'));
  inp.value = name;
  drop.style.display = 'none';
  var row = item.closest('.prod-row');
  row.setAttribute('data-product', name);
  // Si es segundo sabor, calcular precio combo
  if (inp.classList.contains('ac-input2')) {
    calcComboPrice(inp);
  } else {
    // Solo actualizar precio si no hay segundo sabor activo
    var second = row.querySelector('.combo-second');
    var inp2val = second && second.classList.contains('show') ? row.querySelector('.ac-input2').value : '';
    if (!inp2val) {
      row.querySelectorAll('input[type=number]')[1].value = price.toFixed(2);
    } else {
      calcComboPrice(row.querySelector('.ac-input2'));
    }
  }
  calcTots();
}

function acBlur(inp) {
  setTimeout(function() {
    var drop = document.getElementById('drop-' + inp.id);
    if (drop) drop.style.display = 'none';
    // Si lo que escribio no coincide exacto con ningun producto, limpiar precio
    var row = inp.closest('.prod-row');
    var match = catalog.find(function(c) { return c.name.toLowerCase() === inp.value.toLowerCase(); });
    if (!match) {
      row.setAttribute('data-product', '');
    }
  }, 150);
}

function acKey(e, inp) {
  var drop = document.getElementById('drop-' + inp.id);
  var items = drop.querySelectorAll('.ac-item');
  var active = drop.querySelector('.ac-item.active');
  var idx = -1;
  items.forEach(function(it, i) { if (it === active) idx = i; });
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (active) active.classList.remove('active');
    var next = items[idx + 1] || items[0];
    if (next) next.classList.add('active');
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (active) active.classList.remove('active');
    var prev = items[idx - 1] || items[items.length - 1];
    if (prev) prev.classList.add('active');
  } else if (e.key === 'Enter') {
    e.preventDefault();
    if (active) acSelect(active);
    else if (items[0]) acSelect(items[0]);
  } else if (e.key === 'Escape') {
    drop.style.display = 'none';
  }
}

function onProd(sel) { calcTots(); } // legacy compat
function calcTots() {
  var rows = document.querySelectorAll('.prod-row'), sub = 0;
  rows.forEach(function(r) {
    var numInputs = r.querySelectorAll('input[type=number]');
    var q = parseFloat(numInputs[0] ? numInputs[0].value : 0) || 0;
    var p = parseFloat(numInputs[1] ? numInputs[1].value : 0) || 0;
    sub += q * p;
  });
  var del = tipo === 'delivery' ? (parseFloat(document.getElementById('inp-delivery').value) || 0) : 0;
  document.getElementById('t-sub').textContent = 'S/ ' + sub.toFixed(2);
  document.getElementById('t-del-val').textContent = 'S/ ' + del.toFixed(2);
  document.getElementById('t-total').textContent = 'S/ ' + (sub + del).toFixed(2);
}
var API_URL = "https://script.google.com/macros/s/AKfycbyj-tCqMvQoOQRkc_kRmDwOMGCGWiOhupR-jW31wzbtU8zb_NzIqyR3VJ6fplmPwXu8-g/exec";

    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({action: 'insert', data: ord})

}

function updateSheetEstadoPago(id, estadoPago) {

function regOrder() {
  if (!turnoActivo) { alert('Debes abrir un turno antes de registrar pedidos.'); return; }
  var tel = document.getElementById('inp-tel').value.trim();
  if (!tel) { alert('Ingresa el telefono del cliente.'); return; }
  var rows = document.querySelectorAll('.prod-row'), prods = [], ok = true;
  rows.forEach(function(r) {
    var acInp  = r.querySelector('.ac-input:not(.ac-input2)');
    var acInp2 = r.querySelector('.ac-input2');
    var second = r.querySelector('.combo-second');
    var hasCombo = second && second.classList.contains('show') && acInp2 && acInp2.value.trim();
    var n = acInp ? acInp.value.trim() : '';
    if (hasCombo) n = n + ' + ' + acInp2.value.trim();
    var numInputs = r.querySelectorAll('input[type=number]');
    var q = parseFloat(numInputs[0] ? numInputs[0].value : 0) || 0;
    var p = parseFloat(numInputs[1] ? numInputs[1].value : 0) || 0;
    if (!n || q <= 0) { ok = false; return; }
    prods.push({name:n, qty:q, price:p, subtotal:parseFloat((q*p).toFixed(2))});
  });
  if (!ok || !prods.length) { alert('Agrega al menos un producto valido.'); return; }
  var del = tipo === 'delivery' ? (parseFloat(document.getElementById('inp-delivery').value) || 0) : 0;
  var sub = parseFloat(prods.reduce(function(a, p) { return a + p.subtotal; }, 0).toFixed(2));
  var ord = {
    id: counter++, fecha: new Date().toISOString(), tipo: tipo, tel: tel, pago: pago,
    products: prods, subtotal: sub, delivery: parseFloat(del.toFixed(2)),
    total: parseFloat((sub + del).toFixed(2)), estado: 'preparando',
    estadoPago: estadoPago,
    turnoId: turnoActivo ? turnoActivo.id : '',
    notas: document.getElementById('inp-notas').value.trim()
  };
  orders.unshift(ord);
  if (turnoActivo) turnoActivo.pedidos.push(ord.id);
  save(); saveTurno(); saveToSheet(ord); resetForm();
  showToast('Pedido #' + pad(ord.id) + ' registrado');
  goTab('activos', document.querySelector('.tab'));
}
function resetForm() {
  estadoPago = 'Pendiente'; setEstadoPago('Pendiente'); document.getElementById('inp-tel').value = '';
  document.getElementById('inp-notas').value = '';
  document.getElementById('inp-delivery').value = '0';
  document.getElementById('prod-container').innerHTML = '';
  addRow(); calcTots();
}
function showToast(msg) {
  var a = document.getElementById('toast-area');
  a.innerHTML = '<div class="toast" style="display:flex"><i class="ti ti-check" aria-hidden="true"></i> ' + msg + '</div>';
  setTimeout(function() { a.innerHTML = ''; }, 2500);
}
function loadSheet() {
  var url = "https://docs.google.com/spreadsheets/d/1rLRRE7WjJ521Nk_VQAYtscjyQ62kHHim7uARR4o_ZFE/gviz/tq?tqx=out:csv&gid=0";
  setStatus('muted', '<i class="ti ti-refresh"></i> Actualizando catalogo...');
  fetch(url)
    .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
    .then(parseAndLoad)
    .catch(function(err) {
      console.error('loadSheet error:', err);
      setStatus('red', 'Error al cargar el catalogo. Verifica la conexion.');
    });
}



// ── CATALOGO ──
function setStatus(color, msg) {
  var el = document.getElementById('sheet-status');
  if (el) el.innerHTML = '<span style="color:var(--' + color + ')">' + msg + '</span>';
}

function parseAndLoad(txt) {
  var lines = txt.trim().split('\n');
  if (!lines.length) { setStatus('red', 'El archivo esta vacio.'); return; }
  var startLine = 0;
  var primeraCelda = csvSplit(lines[0])[0].replace(/"/g,'').trim().toLowerCase();
  if (isNaN(parseFloat(primeraCelda)) && primeraCelda !== '') startLine = 1;
  var loaded = [];
  for (var i = startLine; i < lines.length; i++) {
    if (!lines[i].trim()) continue;
    var cols = csvSplit(lines[i]);
    var nombre = (cols[0] || '').replace(/^"+|"+$/g, '').trim();
    var precio = parseFloat((cols[1] || '').replace(/^"+|"+$/g, '').replace(/[^0-9.]/g, ''));
    if (nombre && !isNaN(precio) && precio > 0) loaded.push({name: nombre, price: precio});
  }
  if (!loaded.length) {
    setStatus('red', 'No se encontraron productos. Columnas requeridas: Nombre | Precio');
    return;
  }
  catalog = loaded;
  document.querySelectorAll('.prod-row .ac-input').forEach(function(inp) { inp.value = ''; });
  setStatus('green', '<i class="ti ti-check"></i> ' + loaded.length + ' productos cargados.');
}

function csvSplit(line) {
  var cols = [], cur = '', inQ = false;
  for (var j = 0; j < line.length; j++) {
    var ch = line[j];
    if (ch === '"') { inQ = !inQ; cur += ch; }
    else if (ch === ',' && !inQ) { cols.push(cur); cur = ''; }
    else { cur += ch; }
  }
  cols.push(cur);
  return cols;
}

// ── CRONOMETROS ──
var timerInterval = null;
var alertedOrders = {};

var syncInterval = null;

function startTimers() {
  if (timerInterval) clearInterval(timerInterval);
  tickTimers();
  timerInterval = setInterval(tickTimers, 10000);
  // Sincronizar estados desde Sheets cada 30 segundos
  if (syncInterval) clearInterval(syncInterval);
  syncInterval = setInterval(sincronizarEstados, 10000);
}

function sincronizarEstados() {
  if (!turnoActivo) return;
  var cbName = 'cb_sync_' + Date.now();
  var timeout = setTimeout(function() {
    window[cbName] = null;
    var el = document.getElementById('jsonp-' + cbName);
    if (el) el.parentNode.removeChild(el);
  }, 8000);

  window[cbName] = function(data) {
    clearTimeout(timeout);
    var el = document.getElementById('jsonp-' + cbName);
    if (el) el.parentNode.removeChild(el);
    delete window[cbName];
    if (!data || !data.ok || !data.turno) return;
    if (String(data.turno.id) !== String(turnoActivo.id)) return;
    var actualizado = false;
    data.pedidos.forEach(function(p) {
      var local = orders.find(function(o) { return o.id === p.id; });
      if (!local) return;
      if (local.estado !== p.estado || local.estadoPago !== p.estadoPago) {
        local.estado     = p.estado;
        local.estadoPago = p.estadoPago;
        actualizado = true;
      }
    });
    if (actualizado) { save(); renderList(); }
  };

  var script = document.createElement('script');
  script.id  = 'jsonp-' + cbName;
  script.src = API_URL + '?action=getTurnoActivo&callback=' + cbName;
  script.onerror = function() { clearTimeout(timeout); };
  document.head.appendChild(script);
}

function tickTimers() {
  var now = Date.now();
  orders.forEach(function(o) {
    if (o.estado === 'entregado' || o.estado === 'finalizado') return;
    var el = document.getElementById('timer-' + o.id);
    if (!el) return;
    var elapsed = Math.floor((now - new Date(o.fecha).getTime()) / 1000);
    var mins = Math.floor(elapsed / 60);
    var secs = elapsed % 60;
    var display = (mins < 10 ? '0' : '') + mins + ':' + (secs < 10 ? '0' : '') + secs;
    var valEl = el.querySelector('.timer-val');
    if (valEl) valEl.textContent = display;

    if (mins >= 30 && o.estado === 'preparando') {
      o.estado = 'retrasado';
      save();
      updateSheetStatus(o.id, 'retrasado');
      el.classList.remove('timer-prep');
      el.classList.add('timer-ret');
      var card = el.closest('.ocard');
      if (card) { card.classList.remove('preparando'); card.classList.add('retrasado'); }
      var sel = card ? card.querySelector('.stt-sel') : null;
      if (sel) sel.value = 'retrasado';
      if (!alertedOrders[o.id]) {
        alertedOrders[o.id] = true;
        playAlarm();
        showToast('⚠️ Pedido #' + pad(o.id) + ' lleva 30 min — marcado Retrasado');
      }
    }
    if (o.estado === 'retrasado') {
      el.classList.remove('timer-prep');
      el.classList.add('timer-ret');
    }
  });
}

function playAlarm() {
  try {
    var ctx = new (window.AudioContext || window.webkitAudioContext)();
    function beep(freq, start, dur) {
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.frequency.value = freq;
      osc.type = 'sine';
      gain.gain.setValueAtTime(0, ctx.currentTime + start);
      gain.gain.linearRampToValueAtTime(0.4, ctx.currentTime + start + 0.01);
      gain.gain.linearRampToValueAtTime(0, ctx.currentTime + start + dur);
      osc.start(ctx.currentTime + start);
      osc.stop(ctx.currentTime + start + dur + 0.05);
    }
    beep(880, 0.0, 0.15);
    beep(880, 0.2, 0.15);
    beep(880, 0.4, 0.15);
    beep(1100, 0.7, 0.3);
  } catch(e) { console.warn('Audio no disponible:', e); }
}


// Arrancar inmediatamente desde localStorage
turnoActivo = JSON.parse(localStorage.getItem('lv_turno') || 'null');
orders = JSON.parse(localStorage.getItem('lv_orders') || '[]');
addRow(); calcTots(); renderTurnoBar(); renderList(); startTimers(); loadSheet();

// Sincronizar con Sheets en segundo plano
// Cargar turno activo y pedidos desde Sheets
function cargarDesdeSheets() {
  // Usar JSONP para evitar bloqueo CORS de Google Apps Script en GET
  var cbName = 'cb_turno_' + Date.now();
  var timeout = setTimeout(function() {
    console.warn('cargarDesdeSheets: timeout, usando localStorage');
    window[cbName] = null;
    var el = document.getElementById('jsonp-' + cbName);
    if (el) el.parentNode.removeChild(el);
    usarFallback();
  }, 10000);

  window[cbName] = function(data) {
    clearTimeout(timeout);
    var el = document.getElementById('jsonp-' + cbName);
    if (el) el.parentNode.removeChild(el);
    delete window[cbName];
    procesarDatosSheets(data);
  };

  var script = document.createElement('script');
  script.id  = 'jsonp-' + cbName;
  script.src = API_URL + '?action=getTurnoActivo&callback=' + cbName;
  script.onerror = function() {
    clearTimeout(timeout);
    console.warn('cargarDesdeSheets: script error, usando localStorage');
    usarFallback();
  };
  document.head.appendChild(script);
}

function procesarDatosSheets(data) {
  if (data && data.ok && data.turno) {
    turnoActivo = {
      id:      data.turno.id,
      inicio:  data.turno.inicio,
      pedidos: data.pedidos.map(function(p){ return p.id; })
    };
    orders = data.pedidos.map(function(p) {
      return {
        id:         p.id,
        fecha:      p.fecha || new Date().toISOString(),
        tipo:       p.tipo,
        tel:        p.tel,
        pago:       p.pago,
        products:   p.products,
        subtotal:   p.subtotal,
        delivery:   p.delivery,
        total:      p.total,
        estado:     p.estado,
        estadoPago: p.estadoPago,
        turnoId:    p.turnoId,
        notas:      p.notas || ''
      };
    });
    if (orders.length > 0) {
      var maxId = orders.reduce(function(m,o){ return Math.max(m, o.id); }, 0);
      if (maxId >= counter) { counter = maxId + 1; }
      save();
    }
    saveTurno();
  } else {
    turnoActivo = null;
    orders = [];
  }
  appLoading = false;
  renderTurnoBar();
  renderList();
}

function usarFallback() {
  turnoActivo = JSON.parse(localStorage.getItem('lv_turno') || 'null');
  orders      = JSON.parse(localStorage.getItem('lv_orders') || '[]');
  appLoading  = false;
  renderTurnoBar();
  renderList();
}

// Sincronizacion en segundo plano manejada por sincronizarEstados() cada 30s
</script>
